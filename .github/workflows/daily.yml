name: Daily YouTube Shorts

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      video_id:
        description: "Optional YouTube video ID (leave blank to auto-select)"
        required: false
        type: string
      dry_run:
        description: "Render only, do not upload"
        required: false
        type: boolean
        default: false
      force:
        description: "Allow a source already present in state"
        required: false
        type: boolean
        default: false
      privacy:
        description: "Override upload privacy"
        required: false
        type: choice
        default: config
        options:
          - config
          - private
          - unlisted
          - public

permissions:
  contents: write

concurrency:
  group: daily-youtube-shorts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider:latest
        ports:
          - 4416:4416
        options: --init

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: media/requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r media/requirements.txt

      - name: Run daily pipeline
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          YTDLP_POT_PROVIDER_URL: http://127.0.0.1:4416
          VIDEO_ID: ${{ inputs.video_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          PRIVACY_OVERRIDE: ${{ inputs.privacy }}
        run: python scripts/run_daily.py

      - name: Persist used-video state
        if: always()
        run: |
          if [ ! -f state/used_videos.json ]; then
            exit 0
          fi
          if git diff --quiet -- state/used_videos.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/used_videos.json
          git commit -m "chore: update used-video state [skip ci]"
          git push
